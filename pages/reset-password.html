<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | SellSync</title>
  <link rel="icon" type="image/png" href="../icon.png" />
  <link rel="stylesheet" href="../css/login.css?v=7" />
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <div class="brand-content">
        <img src="../icon.png" alt="SellSync" class="brand-logo" width="160" height="160" />
        <h1><span>SellSync</span></h1>
        <p>One platform. Total retail control.</p>
      </div>
    </div>
    <div class="right-panel">
      <div class="form-wrapper">
        <h2>Reset your password</h2>
        <p class="subtitle">Enter the 6-digit code sent to your email and your new password.</p>

        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

        <form id="resetForm" novalidate>
          <div class="field">
            <label for="resetEmail">Email</label>
            <input type="email" id="resetEmail" name="email" required placeholder="name@mail.com" autocomplete="email" />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field">
            <label for="resetCode">6-Digit Code</label>
            <input type="text" id="resetCode" name="code" required placeholder="Enter 6-digit code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" />
            <span class="field-error" id="codeError"></span>
          </div>

          <div class="field">
            <label for="newPassword">New Password</label>
            <div class="password-wrap">
              <input type="password" id="newPassword" name="password" required placeholder="Enter new password" minlength="8" autocomplete="new-password" />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">
                <span class="icon-eye" aria-hidden="true"></span>
                <span class="icon-eye-off" aria-hidden="true"></span>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
            <span class="caps-warning" id="capsWarning" aria-live="polite">Caps Lock is on</span>
          </div>

          <button type="submit" class="btn-login" id="submitBtn">
            <span class="btn-text">Reset Password</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p class="back-to-login"><a href="/reset-email">Didn't get a code? Send again</a></p>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
