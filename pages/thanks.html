<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks for Signing Up! — SellSync</title>
  <link rel="icon" type="image/png" href="../icon.png" />
  <link rel="stylesheet" href="../css/login.css?v=6" />
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <div class="brand-content">
        <img src="../icon.png" alt="SellSync" class="brand-logo" width="160" height="160" />
        <h1><span>SellSync</span></h1>
        <p>One platform. Total retail control.</p>
      </div>
    </div>
    <div class="right-panel">
      <div class="form-wrapper" style="text-align:center;">
        <div style="width:80px;height:80px;background:#10b981;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <h2>Thanks for signing up!</h2>
        <p class="subtitle">We've sent a verification email to your inbox. Please click the link in the email to verify your account, then log in.</p>
        <a href="/login" class="btn-login" style="display:inline-block;margin-top:32px;text-decoration:none;text-align:center;">Go to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
