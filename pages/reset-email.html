<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | SellSync</title>
  <link rel="icon" type="image/png" href="../icon.png" />
  <link rel="stylesheet" href="../css/login.css?v=7" />
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <div class="brand-content">
        <img src="../icon.png" alt="SellSync" class="brand-logo" width="160" height="160" />
        <h1><span>SellSync</span></h1>
        <p>One platform. Total retail control.</p>
      </div>
    </div>
    <div class="right-panel">
      <div class="form-wrapper">
        <h2>Forgot your password?</h2>
        <p class="subtitle">Enter your email and we'll send you a reset code.</p>

        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

        <form id="forgotForm" novalidate>
          <div class="field">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" name="email" required placeholder="name@mail.com" autocomplete="email" />
            <span class="field-error" id="emailError"></span>
          </div>

          <button type="submit" class="btn-login" id="submitBtn">
            <span class="btn-text">Send Reset Code</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p class="back-to-login"><a href="/login">Back to Sign In</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/reset-email.js"></script>
</body>
</html>
